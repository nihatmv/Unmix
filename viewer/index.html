<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unmix viewer</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 1100px;
    margin: 2rem auto;
    padding: 0 1rem;
    color: #0b0b0b;
    background: #fcfcfb;
  }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1rem; margin: 0; }
  button, select { font: inherit; padding: 0.35rem 0.9rem; }
  button { cursor: pointer; }
  button:disabled { cursor: default; }
  select { max-width: 100%; }
  .toolbar, .layer-head { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
  .toolbar { margin-bottom: 1rem; }
  .picker { padding-bottom: 1rem; border-bottom: 1px solid #e1e0d9; }
  .versions { display: flex; gap: 0.75rem; margin-right: 0.75rem; }
  .layer { margin-bottom: 1.5rem; }
  .layer-head { margin-bottom: 0.4rem; }
  .layer-head h2 { flex: 1; }
  .wave { border: 1px solid #e1e0d9; border-radius: 4px; background: #fff; min-height: 110px; }
  #status, #time { color: #52514e; }
  #time { font-variant-numeric: tabular-nums; }
  #status.error { color: #d03b3b; }
</style>
</head>
<body>

<h1>Unmix viewer</h1>

<div class="toolbar picker">
  <label for="file">Clip from input/</label>
  <select id="file"></select>
  <label for="method">Method</label>
  <select id="method">
    <option value="repet">REPET (quick, rough)</option>
    <option value="demucs">Demucs (slower, cleaner)</option>
    <option value="both">Both</option>
  </select>
  <button id="separate" disabled>Separate</button>
  <button id="refresh" title="Look in input/ again">Refresh list</button>
  <span id="status" role="status"></span>
</div>

<div class="toolbar">
  <span id="version-label">Listen to</span>
  <span class="versions" role="radiogroup" aria-labelledby="version-label">
    <label><input type="radio" name="version" value="repet" disabled> REPET</label>
    <label><input type="radio" name="version" value="demucs" disabled> Demucs</label>
  </span>
  <button id="play-all" disabled>Play all synced</button>
  <span id="time"></span>
</div>

<div id="layers"></div>

<script src="https://unpkg.com/wavesurfer.js@7.8.6/dist/wavesurfer.min.js"></script>
<script>
// The three layers. The colours match the plots in output/separation.png.
const LAYERS = [
  { name: "Original",   file: "original.wav",   color: "#2a78d6" },
  { name: "Foreground", file: "foreground.wav", color: "#eb6834" },
  { name: "Background", file: "background.wav", color: "#1baf7a" },
];

// The two separation methods. Each one's result is a "version" you can listen
// to, kept in its own folder: output/repet/ and output/demucs/.
const METHOD_NAMES = { repet: "REPET", demucs: "Demucs" };

const fileSelect = document.getElementById("file");
const methodSelect = document.getElementById("method");
const versionRadios = [...document.querySelectorAll('input[name="version"]')];
const separateButton = document.getElementById("separate");
const refreshButton = document.getElementById("refresh");
const statusLabel = document.getElementById("status");
const playAllButton = document.getElementById("play-all");
const timeLabel = document.getElementById("time");

// ---------------------------------------------------------------------------
// The three waveform rows
// ---------------------------------------------------------------------------

// Build one row per layer: a title, a mute box, a play button and a waveform.
// The waveforms start empty; loadLayers() fills them in.
const players = LAYERS.map((layer) => {
  const row = document.createElement("section");
  row.className = "layer";
  row.innerHTML = `
    <div class="layer-head">
      <h2>${layer.name}</h2>
      <label><input type="checkbox"> Mute</label>
      <button disabled>Play</button>
    </div>
    <div class="wave"></div>`;
  document.getElementById("layers").append(row);

  const wavesurfer = WaveSurfer.create({
    container: row.querySelector(".wave"),
    waveColor: layer.color,
    progressColor: "#52514e",
    cursorColor: "#0b0b0b",
    height: 110,
    // Draw every layer at its true height instead of stretching each one to
    // fill its box, so a quiet layer looks quiet.
    normalize: false,
  });

  const player = {
    layer,
    wavesurfer,
    button: row.querySelector("button"),
    mute: row.querySelector("input"),
  };

  // Clicking a waveform moves the playhead in all three, so they stay lined up.
  wavesurfer.on("interaction", (time) => seekAll(time, player));

  // Play button: play just this layer.
  player.button.addEventListener("click", () => {
    if (wavesurfer.isPlaying()) {
      pauseAll();
    } else {
      pauseAll();
      wavesurfer.play();
    }
  });

  player.mute.addEventListener("change", () => wavesurfer.setMuted(player.mute.checked));

  wavesurfer.on("play", updateButtons);
  wavesurfer.on("pause", updateButtons);
  wavesurfer.on("finish", updateButtons);
  wavesurfer.on("timeupdate", (time) => {
    if (wavesurfer.isPlaying()) showTime(time);
  });

  return player;
});

// Load (or reload) one version's three WAV files into the waveforms.
// `version` is "repet" or "demucs", the folder in output/ to read from.
async function loadLayers(version) {
  // Remember the position and what was playing. Switching version in the
  // middle of listening then carries on from the same spot, which makes the
  // two easy to compare.
  const time = players[0].wavesurfer.getCurrentTime();
  const wasPlaying = players.filter((p) => p.wavesurfer.isPlaying());
  pauseAll();
  setPlaybackEnabled(false);
  versionRadios.forEach((radio) => (radio.disabled = true));
  timeLabel.textContent = "Loading waveforms…";

  // The "?t=..." makes each address unique, so the browser fetches the new
  // files instead of reusing the ones it loaded before.
  const stamp = Date.now();
  await Promise.all(
    players.map((p) => p.wavesurfer.load(`../output/${version}/${p.layer.file}?t=${stamp}`))
  );

  setPlaybackEnabled(true);
  showVersions();
  // If the new files are shorter than the old position, start from the top.
  seekAll(time < players[0].wavesurfer.getDuration() ? time : 0);
  wasPlaying.forEach((p) => p.wavesurfer.play());
}

function setPlaybackEnabled(enabled) {
  playAllButton.disabled = !enabled;
  players.forEach((p) => (p.button.disabled = !enabled));
}

// ---------------------------------------------------------------------------
// Choosing which version to listen to
// ---------------------------------------------------------------------------

// The server's latest answer to /api/state.
let state = null;

// A version can be chosen only if its folder in output/ holds the three files.
function showVersions() {
  versionRadios.forEach((radio) => {
    radio.disabled = !state.versions[radio.value].has_output;
  });
}

// The version that is selected, or null if there is nothing to listen to yet.
function selectedVersion() {
  const radio = versionRadios.find((r) => r.checked);
  return radio ? radio.value : null;
}

// Select `preferred` if it has files. Otherwise keep the current choice, or
// fall back to whichever version exists.
function selectVersion(preferred) {
  const available = (name) => name in state.versions && state.versions[name].has_output;
  const choice = [preferred, selectedVersion(), "repet", "demucs"].find(available);
  versionRadios.forEach((radio) => (radio.checked = radio.value === choice));
  return choice;
}

versionRadios.forEach((radio) => {
  radio.addEventListener("change", async () => {
    await loadLayers(radio.value);
    setStatus(describe());
  });
});

function pauseAll() {
  players.forEach((p) => p.wavesurfer.pause());
}

function seekAll(time, except) {
  players.forEach((p) => {
    if (p !== except) p.wavesurfer.setTime(time);
  });
  showTime(time);
}

// "Play all synced": put every layer at the same position, then start them
// together. Use the Mute boxes to choose which layers you hear.
playAllButton.addEventListener("click", () => {
  const playingCount = players.filter((p) => p.wavesurfer.isPlaying()).length;
  if (playingCount === players.length) {
    pauseAll();
    return;
  }
  const time = players[0].wavesurfer.getCurrentTime();
  pauseAll();
  seekAll(time);
  players.forEach((p) => p.wavesurfer.play());
});

function updateButtons() {
  const playing = players.map((p) => p.wavesurfer.isPlaying());
  const allPlaying = playing.every(Boolean);
  playAllButton.textContent = allPlaying ? "Pause all" : "Play all synced";
  players.forEach((p, i) => {
    p.button.textContent = playing[i] && !allPlaying ? "Pause" : "Play";
  });
}

function showTime(seconds) {
  const total = players[0].wavesurfer.getDuration();
  timeLabel.textContent = `${format(seconds)} / ${format(total)}`;
}

function format(seconds) {
  const minutes = Math.floor(seconds / 60);
  const rest = Math.floor(seconds % 60);
  return `${minutes}:${String(rest).padStart(2, "0")}`;
}

// ---------------------------------------------------------------------------
// Choosing a clip and running the separation
// ---------------------------------------------------------------------------

function setStatus(text, isError = false) {
  statusLabel.textContent = text;
  statusLabel.classList.toggle("error", isError);
}

// Fill the dropdown with the clips the server found in input/.
function showFiles() {
  const previous = fileSelect.value;
  fileSelect.replaceChildren(...state.files.map((name) => new Option(name, name)));
  // Keep the current choice if it is still there; otherwise select the clip
  // that the selected version was made from.
  const version = selectedVersion();
  const source = version ? state.versions[version].source : null;
  const preferred = [previous, source].find((name) => state.files.includes(name));
  if (preferred) fileSelect.value = preferred;
  separateButton.disabled = state.files.length === 0 || state.busy;
}

function describe() {
  if (state.files.length === 0) return "No WAV or MP3 files in input/ yet.";
  if (state.busy) return "A separation is already running. Refresh in a moment.";
  const version = selectedVersion();
  if (!version) return "Choose a clip and press Separate.";
  // The two versions can come from different clips, so always say which clip
  // and which method you are hearing.
  const source = state.versions[version].source || "unknown clip";
  return `Showing: ${source}, separated by ${METHOD_NAMES[version]}`;
}

// Take in a new answer from the server and update everything that shows it.
// `preferredVersion` is the version to switch to, if it has files.
function showState(newState, preferredVersion) {
  state = newState;
  showVersions();
  const version = selectVersion(preferredVersion);
  showFiles();
  setStatus(describe());
  return version;
}

async function refresh() {
  return showState(await (await fetch("/api/state")).json());
}

refreshButton.addEventListener("click", refresh);

separateButton.addEventListener("click", async () => {
  const name = fileSelect.value;
  const method = methodSelect.value;
  const methodLabel = METHOD_NAMES[method] || "REPET and Demucs";
  pauseAll();
  setPlaybackEnabled(false);
  separateButton.disabled = true;
  fileSelect.disabled = true;
  methodSelect.disabled = true;
  versionRadios.forEach((radio) => (radio.disabled = true));

  // The separation takes a while, so show a running clock while we wait.
  const started = Date.now();
  const tick = () =>
    setStatus(
      `Separating ${name} with ${methodLabel}… ${Math.round((Date.now() - started) / 1000)}s`
    );
  tick();
  const timer = setInterval(tick, 1000);

  try {
    const response = await fetch("/api/separate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ file: name, method }),
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error);
    clearInterval(timer);
    // Show the version that was just made. After "Both", stay on the one you
    // were listening to.
    const version = showState(result, method);
    // A new result starts from the beginning.
    seekAll(0);
    await loadLayers(version);
    setStatus(describe());
  } catch (error) {
    clearInterval(timer);
    setStatus(error.message, true);
    // The files in output/ are untouched after a failure, so the old
    // waveforms are still valid.
    setPlaybackEnabled(players[0].wavesurfer.getDuration() > 0);
    showVersions();
  } finally {
    fileSelect.disabled = false;
    methodSelect.disabled = false;
    separateButton.disabled = fileSelect.options.length === 0;
  }
});

// On page load: list the clips, and show the last result if there is one.
refresh()
  .then((version) => (version ? loadLayers(version) : null))
  .catch(() => setStatus("Could not reach the server. Start it with src/serve.py.", true));
</script>
</body>
</html>
